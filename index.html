<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%86%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;600&family=Nunito:wght@400;700&display=swap">
</head>
<body>
<div class="wrap">
  <div class="heading-row">
    <h1 id="dateHeading">Today</h1>
    <div class="mini-history">
      <button id="undoBtn" class="mini-btn" title="Undo (Ctrl+Z)">&#8630;</button>
      <button id="redoBtn" class="mini-btn" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
    </div>
  </div>

  <div class="day-progress">
    <div class="day-progress-bar"><div class="day-progress-fill" id="dayProgressFill"></div></div>
    <span class="day-progress-label" id="dayProgressLabel"></span>
  </div>

  <div class="mini-timeline" id="miniTimeline"></div>
  <div class="mini-tooltip" id="miniTooltip"></div>

  <div class="consistency" id="consistencyBlock" style="display:none;"></div>

  <div class="night-sky" id="nightSkyBlock" style="display:none;" role="button" tabindex="0" aria-expanded="false">
    <svg id="nightSky" viewBox="0 0 1000 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Your night sky: one star for each good day">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a1230"/>
          <stop offset="1" stop-color="#23365f"/>
        </linearGradient>
        <linearGradient id="treeSkyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fd0ee"/>
          <stop offset="1" stop-color="#e3f1f6"/>
        </linearGradient>
        <linearGradient id="meteorGrad">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="1" stop-color="#fff6d8" stop-opacity="0.95"/>
        </linearGradient>
        <filter id="skyGlow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="1000" height="380" fill="url(#skyGrad)"/>
      <g id="skyBg"></g>
      <g id="pondBase"></g>
      <g id="treeBase"></g>
      <g id="plantBase"></g>
      <g id="skyFx"></g>
      <g id="skyCons"></g>
      <g id="pondFx"></g>
      <g id="treeFx"></g>
      <g id="plantFx"></g>
    </svg>
    <p class="night-sky-caption" id="nightSkyCaption"></p>
  </div>

  <div class="control-grid">
    <div class="daytabs-scroll" id="dayTabsScroll">
      <div class="daytabs" id="dayTabs"></div>
    </div>
    <button id="todayBtn" class="mini-btn today-btn" title="Jump to today (T)">&#8226;</button>
    <div class="more-menu-wrap">
      <button id="moreBtn" class="mini-btn today-btn" title="More options">&#8942;</button>
      <div class="more-menu" id="moreMenu" style="display:none;">
        <button id="proportionalToggle">Timeline</button>
        <button id="copyYesterdayBtn">Copy previous day</button>
        <button id="templatesToggle">Templates</button>
        <button id="categoriesToggle">Categories</button>
        <button id="recurringToggle">Recurring</button>
        <button id="settingsToggle" title="Shortcut: ,">Settings</button>
        <button id="summaryToggle">Summary</button>
        <button class="danger" id="clearBtn">Clear day</button>
      </div>
    </div>
    <button class="primary" id="addBtn" title="Shortcut: N">+ Add block</button>
    <button id="sortBtn" title="Shortcut: S">Sort</button>
  </div>

  <div class="toolbar" id="quickAddRow" style="display:none;">
    <input type="text" id="quickAddInput" placeholder='e.g. "Training 4pm 90m"' style="flex:1; min-width:180px;">
    <button class="primary" id="quickAddBtn">Add</button>
  </div>

  <div class="panel" id="summaryPanel" style="display:none;">
    <div id="summaryContent" class="summary-content">Loading…</div>
  </div>

  <div class="panel" id="settingsPanel" style="display:none;">
    <div class="set-tabs" role="tablist">
      <button type="button" role="tab" data-tab="look" aria-selected="true">Look</button>
      <button type="button" role="tab" data-tab="show" aria-selected="false">Show</button>
      <button type="button" role="tab" data-tab="picture" aria-selected="false">Picture</button>
      <button type="button" role="tab" data-tab="backup" aria-selected="false">Backup</button>
    </div>
    <div class="set-tab" data-tab="look" role="tabpanel">
    <div class="toolbar">
      <label class="setting-label">Theme
        <select id="themeSelect">
          <option value="original">Original</option>
          <option value="cards">1 · Soft Cards</option>
          <option value="night">2 · Night Forest</option>
          <option value="lake">3 · Lake Blue</option>
          <option value="sunrise">4 · Sunrise</option>
          <option value="minimal">5 · Clean Minimal</option>
          <option value="blocks">6 · Colour Blocks</option>
          <option value="compact">7 · Compact List</option>
          <option value="notebook">8 · Notebook</option>
          <option value="tackle">9 · Tackle Box</option>
          <option value="bold">10 · Big &amp; Bold</option>
        </select>
      </label>
    </div>
    <div class="toolbar">
      <label class="setting-label">Background <input type="color" id="bgColorInput" class="cat-color-input"></label>
      <label class="setting-label">Accent <input type="color" id="accentColorInput" class="cat-color-input"></label>
    </div>
    <div class="toolbar">
      <label class="setting-label">Font
        <select id="fontSelect">
          <option value="serif">Serif (classic)</option>
          <option value="sans">Sans-serif (clean)</option>
          <option value="modern">Modern (DM Sans)</option>
          <option value="rounded">Rounded (Nunito)</option>
          <option value="sturdy">Sturdy (Trebuchet)</option>
          <option value="big">Big (Verdana)</option>
        </select>
      </label>
    </div>
    <div class="toolbar">
      <button id="darkModeBtn">Dark mode</button>
      <label class="setting-label"><input type="checkbox" id="followSunToggle"> Darken at sunset</label>
    </div>
    <div class="toolbar">
      <button id="resetAppearanceBtn">Reset to default</button>
    </div>
    </div>
    <div class="set-tab" data-tab="show" role="tabpanel" hidden>
    <div class="toolbar">
      <label class="setting-label"><input type="checkbox" id="showProgressToggle"> Progress bar</label>
      <label class="setting-label"><input type="checkbox" id="showMiniTimelineToggle"> Day timeline strip</label>
      <label class="setting-label"><input type="checkbox" id="showConsistencyToggle"> Consistency grid</label>
      <label class="setting-label"><input type="checkbox" id="quickAddToggle"> Quick add (type-to-add)</label>
    </div>
    <div class="toolbar">
      <button id="remindersBtn">Turn on reminders</button>
      <span class="sub" id="remindersStatus" style="margin:0;"></span>
    </div>
    </div>
    <div class="set-tab" data-tab="backup" role="tabpanel" hidden>
    <div class="toolbar">
      <button id="exportBtn">Export backup</button>
      <button id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <span class="sub" id="importStatus" style="margin:0;"></span>
    </div>
    <p class="sub" id="compactStatus" style="margin:0 0 10px;"></p>
    <div class="toolbar">
      <button id="signOutBtn">Sign out</button>
    </div>
    </div>
    <div class="set-tab" data-tab="picture" role="tabpanel" hidden>
    <div class="toolbar">
      <label class="setting-label"><input type="checkbox" id="showNightSkyToggle"> Growing picture</label>
      <label class="setting-label">Picture
        <select id="growLookSelect">
          <option value="sky">Night sky</option>
          <option value="pond">Fish pond</option>
          <option value="tree">Slow tree</option>
          <option value="plant">Little plant</option>
        </select>
      </label>
      <label class="setting-label">A good day is
        <select id="goodDaySelect">
          <option value="0.5">half my blocks done</option>
          <option value="0.75">three quarters done</option>
          <option value="1">all my blocks done</option>
        </select>
      </label>
    </div>
    </div>
  </div>

  <div class="panel" id="templatesPanel" style="display:none;">
    <div class="toolbar">
      <input id="templateNameInput" type="text" placeholder="Template name">
      <button id="saveTemplateBtn">Save current day</button>
    </div>
    <div class="toolbar">
      <select id="templateSelect"></select>
      <button id="applyTemplateBtn">Apply</button>
      <button class="danger" id="deleteTemplateBtn">Delete</button>
    </div>
    <p class="sub" id="templateStatus"></p>
  </div>

  <div class="panel" id="categoriesPanel" style="display:none;">
    <div class="cat-manager" id="catManager"></div>
  </div>

  <div class="panel" id="recurringPanel" style="display:none;">
    <div class="toolbar">
      <select id="recurTemplateSelect"></select>
      <div class="weekday-picker" id="recurWeekdayPicker"></div>
      <button class="primary" id="addRecurBtn">+ Auto-apply</button>
    </div>
    <div id="recurList"></div>
  </div>

  <div class="track" id="track"></div>
  <div class="add-row"><button id="addBtn2">+ Add block</button></div>
  <div class="status" id="status"></div>
  <div class="toast" id="toast"></div>
</div>

<div class="sign-in" id="signIn" hidden>
  <form class="sign-in-box" id="signInForm">
    <h2>Day planner</h2>
    <p class="sign-in-note">Sign in to see your days on any device.</p>
    <label>Email <input type="email" id="signInEmail" autocomplete="email" required></label>
    <label>Password <input type="password" id="signInPassword" autocomplete="current-password" minlength="6" required></label>
    <div class="sign-in-buttons">
      <button type="submit" class="primary" id="signInBtn">Sign in</button>
      <button type="button" id="signUpBtn">Create account</button>
    </div>
    <p class="sign-in-note" id="signInMsg" role="status"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="storage.js"></script>

<script src="app.js"></script>
</body>
</html>
